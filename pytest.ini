[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# `testpaths` only applies when pytest is invoked with NO path argument. `pytest .`, a
# pre-commit hook that passes changed files, and most IDE "run tests in this folder" actions
# all bypass it — and digital_born/ holds Phase 0 probes that import optional deps
# (docling, pdfplumber) deliberately absent from the base install. Collecting them is a
# COLLECTION ERROR, i.e. a red suite caused by a probe rather than by the code under test.
# The probes were renamed test_* -> probe_* so python_files no longer matches them; this is
# the second line of defence, because a future probe named test_something.py would otherwise
# silently reintroduce the problem. digital_born/README.md used to offer this as a fallback
# in `[tool.pytest.ini_options]` syntax with a JSON array — neither of which is valid here.
norecursedirs = digital_born .git build dist *.egg-info .venv venv
# Fail on an unregistered @pytest.mark instead of warning: a typo'd marker name otherwise
# silently selects nothing, so `-m "not slow"` can quietly run the very tests it excludes.
addopts = --strict-markers
markers =
    slow: tests that require ML models, GPU, or network — skip with -m "not slow"
