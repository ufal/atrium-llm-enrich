name: LLM Enrich Runtime

on:
  push:
    # Ensure triggers use real branches, as using main means workflows never run on real activity[cite: 1, 2]
    branches: [test, master]
  pull_request:
    branches: [test, master]

jobs:
  execute-enrichment:
    runs-on: ubuntu-latest
    # Map the secrets to the job environment, mirroring how CODECOV_TOKEN is handled in the shared reusable workflows[cite: 1, 2]
    env:
      OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Execute LLM Pipeline Wrapper
        # This step acts as the clean input contract
        # If the environment variables are absent (e.g., in a local run), the wrapper should gracefully fallback or mock the external call
        run: |
          if [ -z "$OPENROUTER_KEY" ]; then
            echo "Running locally or without credentials. Skipping external model calls."
            # Insert local pipeline execution command here
          else
            echo "Credentials found. Executing external LLM runtime."
            # Insert credential-aware execution command here
          fi