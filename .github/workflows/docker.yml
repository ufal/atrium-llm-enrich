name: Docker Build & Publish

on:
  push:
    branches: [test, main]
    tags: ['v*']
  pull_request:
    branches: [test, main]
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # never cancel a tag build - that is a publish in flight
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    permissions:
      # security-events:write is required because docker-tool.reusable.yml's
      # build-and-push job uploads the post-publish Trivy SARIF. A reusable
      # workflow's permissions are CAPPED BY THIS BLOCK, so omitting it makes
      # GitHub reject the whole file at parse time with "requesting
      # 'security-events: write', but is only allowed 'security-events: none'"
      # — a startup_failure, not a step failure (#18). Same grant security.yml
      # already makes for its own SARIF upload. Not an escalation: this job
      # already holds packages: write.
      contents: read
      packages: write
      security-events: write
    uses: ufal/atrium-project/.github/workflows/docker-tool.reusable.yml@v1
    secrets:
      # Explicit instead of `secrets: inherit` — the reusable declares and
      # needs only this one (#18). inherit handed it every repo secret.
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    with:
      image-name: ufal/atrium-llm-enrich
      apt-packages: ""
      pre-install-torch: ""
      # requirements-test.txt is listed because THIS job is the one that runs
      # `pytest -m "not slow" --cov` (docker-tool.reusable.yml). It was omitted, so the
      # file named "test requirements" was never installed in the job that runs the
      # tests — the reusable's own `pip install pytest pytest-cov ruff` was the only
      # reason pytest worked at all. Two consequences, both real:
      #   * every runtime dep a test needs had to be duplicated into requirements.txt
      #     (pandas, pydantic, tqdm are there for exactly this reason);
      #   * anything declared only in requirements-test.txt silently did not exist, so
      #     tests/test_api_contract.py module-skipped on missing fastapi and the schema
      #     validation tests failed on missing jsonschema.
      # Adding it installs fastapi/httpx/python-multipart/openapi-spec-validator and
      # jsonschema, which un-skips 5 previously-skipped tests (all passing).
      requirements: "requirements.txt requirements_remote.txt requirements-test.txt"
      hf-model-cache: false
      # NOTE: "base" is deliberately NOT listed. The Dockerfile stage order is
      # base -> remote -> llm; the reusable workflow maps target="base" to an
      # *empty* --target, which Docker resolves to the LAST declared stage
      # (llm), not the base layer. Including "base" here would publish the
      # llm image a second time under the unsuffixed tag instead of a real
      # lean base image. base has no ENTRYPOINT and is not meant to be run
      # standalone — only remote and llm are publishable targets. (Targets now
      # pass through verbatim, so listing "base" would build the real base
      # stage — still pointless here, so it stays excluded.)
      # W8: "digital" added. api_util/digital_to_json.py (808 lines, PROGRAM =
      # "digital-convert") has existed and been tested for a while, but no Dockerfile
      # stage built it and no target published it — so
      # ghcr.io/ufal/atrium-llm-enrich-digital did not exist at ANY tag, and the
      # two-originator path (scan vs born-digital) was reachable only through unit
      # tests inside this repo. That is the "needs a published image" blocker on the
      # sixth E2E stage.
      #
      # Still declared-but-unpublished: the `api` stage. Same failure mode, older and
      # pre-existing; flagged rather than fixed here so this change stays reviewable.
      build-targets: '["remote", "llm", "digital"]'