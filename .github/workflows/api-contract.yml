name: API Meta-Contract
on:
  push:
    branches: [test, main]
  pull_request:
    branches: [test, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read   # least privilege: these jobs only ever read the tree

jobs:
  api-contract:
    uses: ufal/atrium-project/.github/workflows/api-contract.reusable.yml@v1
